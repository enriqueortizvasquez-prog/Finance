<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Finanzas de Edward · Mosaico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=Geist:wght@200;300;400;500;600&family=Manrope:wght@200;300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#060607;color:#e8e8ee;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;outline:none;background:none;border:0}
svg{flex:none}

/* ================= DISEÑO MOSAICO + 5 PALETAS OSCURAS ================= */
body[data-theme="mosaico"]{--font:'Bricolage Grotesque';--num:'Bricolage Grotesque';--num-w:400;--head:'Bricolage Grotesque';--soft:rgba(255,255,255,.04);
  --bg:#000;--tile:#101010;--sheet:#141414;--text:#EDEDED;--muted:#7A7A7A;--faint:#1F1F1F;--accent:#CFCFCF;--glow1:#4A4A4A;--glow2:#2A2A2A;--inc:#A3B8A0;--exp:#C08A84;--tint:#9A9A9A}
body[data-pal="carbon"]  {--bg:#000000;--tile:#0F0F0F;--sheet:#141414;--text:#EDEDED;--muted:#767676;--faint:#1E1E1E;--accent:#D0D0D0;--glow1:#505050;--glow2:#2B2B2B;--inc:#A6B5A2;--exp:#C2918B;--tint:#9C9C9C}
body[data-pal="musgo"]   {--bg:#030403;--tile:#0E110D;--sheet:#131711;--text:#E6E9E2;--muted:#7C8575;--faint:#1C211A;--accent:#8E9E7A;--glow1:#3E4D31;--glow2:#1E2818;--inc:#9FB28C;--exp:#B98477;--tint:#8E9E7A}
body[data-pal="vino"]    {--bg:#040203;--tile:#120C0D;--sheet:#180F11;--text:#EEE6E7;--muted:#8A7A7C;--faint:#241A1C;--accent:#A3666F;--glow1:#5C2631;--glow2:#2D1419;--inc:#A9B59A;--exp:#C98078;--tint:#A3666F}
body[data-pal="petroleo"]{--bg:#020405;--tile:#0B1012;--sheet:#0F1618;--text:#E3EBEC;--muted:#74868A;--faint:#192225;--accent:#6F99A1;--glow1:#1F4751;--glow2:#12262B;--inc:#8FB3A5;--exp:#C08A80;--tint:#6F99A1}
body[data-pal="bronce"]  {--bg:#040302;--tile:#12100C;--sheet:#171410;--text:#EEE9E1;--muted:#8A8172;--faint:#24201A;--accent:#B09670;--glow1:#5C4627;--glow2:#2D2315;--inc:#A8B391;--exp:#C48775;--tint:#B09670}
/* los colores de cuentas y categorías se apagan hacia el tono de la paleta */
*{--cc:color-mix(in oklab,var(--c,#888) 30%,var(--tint,#888))}

/* ================= ESTUDIO (escritorio) ================= */
.studio{width:100%;max-width:1180px;padding:28px 24px 6px;display:flex;flex-direction:column;gap:14px;font-family:'DM Sans',Inter,sans-serif}
.studio h1{font-weight:500;font-size:21px;letter-spacing:-.02em}
.studio h1 span{color:#6d6d75;font-weight:400}
.theme-tabs{display:flex;gap:6px;flex-wrap:wrap}
.theme-tab{padding:9px 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:9px;color:#8d8d96;transition:.2s}
.theme-tab:hover{color:#fff}
.theme-tab .sw{width:12px;height:12px;border-radius:50%}
.theme-tab.on{background:#16161a;color:#fff}
.stage{display:flex;gap:56px;align-items:flex-start;justify-content:center;padding:20px 24px 50px;width:100%;max-width:1180px}
.notes{width:330px;flex:none;padding-top:24px;display:flex;flex-direction:column;gap:20px;font-size:14px;color:#9a9aa4;line-height:1.6;font-family:'DM Sans',Inter,sans-serif}
.notes h2{color:#fff;font-size:30px;letter-spacing:-.03em;font-weight:400}
.notes h4{color:#5f5f68;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.notes b{color:#ddd;font-weight:500}

/* ================= TELÉFONO ================= */
.phone{width:390px;height:830px;border-radius:54px;position:relative;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 10px #141417,0 0 0 11px #26262b,0 50px 90px rgba(0,0,0,.6);color:var(--text);font-family:var(--font),system-ui,sans-serif;isolation:isolate;flex:none;transition:background .5s}
@media (max-width:760px){
  .studio,.notes{display:none}
  .stage{padding:0}
  body{background:var(--bg)}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 26px 110px;scrollbar-width:none;z-index:2}
.screen::-webkit-scrollbar{display:none}
.phone::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,transparent,var(--bg));z-index:5;pointer-events:none}
.fade-in{animation:fin .45s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-l{animation:sl .45s cubic-bezier(.2,.9,.2,1)} .slide-r{animation:sr .45s cubic-bezier(.2,.9,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* ================= BASE COMPARTIDA ================= */
.mt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px}
.greet{font-size:14px;color:var(--muted)}
.greet b{color:var(--text);font-weight:500}
.back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);margin-left:-6px;padding:4px 6px}
.mnav{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.mnav button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.mnav button:disabled{opacity:.2;cursor:default}
.mnav span{min-width:70px;text-align:center;color:var(--text)}
.title{font-family:var(--head);font-size:34px;font-weight:400;letter-spacing:-.03em;margin:10px 0 4px}
.sub{font-size:14px;color:var(--muted);line-height:1.5}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 10px;font-size:13px;color:var(--muted)}
.h button{color:var(--muted);font-size:13px;border-bottom:1px solid var(--faint);padding-bottom:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none;display:inline-block}
.mono{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;letter-spacing:-.02em;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 22%,transparent);font-family:var(--font)}
.mono.s{width:18px;height:18px;border-radius:6px;font-size:9px}
.mono.l{width:38px;height:38px;border-radius:13px;font-size:14px}
.cr{padding:13px 0 0;width:100%;display:block}
.cr .l{display:flex;align-items:center;gap:12px;font-size:15px}
.cr .l span{flex:1;text-align:left}
.cr .l em{font-style:normal;font-size:12px;color:var(--muted)}
.cr .l b{font-family:var(--num);font-weight:400;font-size:15px;min-width:92px;text-align:right}
.hair{height:1px;background:var(--faint);margin-top:12px;position:relative}
.hair i{position:absolute;left:0;top:0;height:1px;background:var(--cc);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.hair.over i{background:var(--exp)}
.split{display:flex;height:4px;border-radius:4px;overflow:hidden;gap:3px;margin:18px 0 6px}
.split i{background:var(--cc);border-radius:4px}
.tr{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--faint)}
.tr .m{flex:1;min-width:0}
.tr span{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden}
.tr b{font-family:var(--num);font-weight:400;font-size:15px;white-space:nowrap}
.tr b.inc{color:var(--inc)} .tr b.mov{color:var(--muted)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:26px 0 0;text-transform:capitalize}
.empty{color:var(--muted);padding:26px 0;font-size:14px}
.search{width:100%;margin:14px 0 4px;padding:12px 0;border-bottom:1px solid var(--faint);font-size:15px}
.search::placeholder{color:var(--muted)}
.tog{display:flex;gap:18px;margin-top:12px;font-size:14px;flex-wrap:wrap}
.tog button{color:var(--muted);padding:4px 0;position:relative}
.tog button.on{color:var(--text)}
.tog button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--accent);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:14px -26px 0;padding:0 26px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--soft);transition:.2s;white-space:nowrap;flex:none}
.chip.on{color:var(--text);background:color-mix(in srgb,var(--c,#fff) 16%,transparent)}
.chip.add{padding-left:12px;background:none;box-shadow:inset 0 0 0 1px var(--faint)}
.chip.plain{padding-left:13px}
.state{font-family:var(--head);font-size:26px;line-height:1.3;font-weight:300;letter-spacing:-.02em;margin:16px 0 6px}
.state b{font-weight:400;font-family:var(--num)}
.state em{font-style:normal;color:var(--muted)}
.over-t{color:var(--exp)!important}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--faint);width:100%;font-size:15px;text-align:left}
.srow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);flex:none}
.srow .t{flex:1;min-width:0}
.srow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.srow input{text-align:right;color:var(--text);width:150px}
.srow .chev{color:var(--muted)}
.srow .val{font-family:var(--num);font-size:15px;white-space:nowrap}
.srow.danger{color:var(--exp)}
.srow.addrow{color:var(--accent)}
.srow.addrow .ic{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.me-card{display:flex;align-items:center;gap:16px;margin:14px 0 4px}
.me-card .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--bg);background:var(--accent);font-weight:600;font-family:var(--head)}
.me-card input{font-size:22px;font-weight:400;letter-spacing:-.02em;width:100%;font-family:var(--head)}
.me-card small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.th-prev{width:36px;height:36px;border-radius:12px;flex:none}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.on>.radio{border-color:var(--text)} .on>.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--text)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--faint);position:relative;flex:none;transition:.25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.25s}
.switch.on{background:var(--accent)} .switch.on::after{left:21px;background:var(--bg)}
.foot{color:var(--muted);font-size:11px;margin-top:34px;text-align:center;opacity:.7}

/* =====================================================================
   1 · MOSAICO — sin barra. El inicio es un mosaico: cada bloque se expande
   ===================================================================== */
body[data-theme="mosaico"] .screen{padding:60px 20px 80px}
body[data-theme="mosaico"] .chips.scroll{margin:16px -20px 0;padding:0 20px}
body[data-theme="mosaico"] .title{font-weight:500;font-size:38px;letter-spacing:-.04em;margin:14px 0 6px}
body[data-theme="mosaico"] .tr{background:var(--tile);border:0;border-radius:24px;padding:16px 18px;margin-top:10px}
body[data-theme="mosaico"] .srow{background:var(--tile);border:0;border-radius:24px;padding:16px 18px;margin-top:10px}
body[data-theme="mosaico"] .cr{background:var(--tile);border-radius:24px;padding:17px 18px 16px;margin-top:10px}
body[data-theme="mosaico"] .day{margin-top:28px;padding:0 6px}
body[data-theme="mosaico"] .h{padding:0 6px;margin:40px 0 4px}
body[data-theme="mosaico"] .mt,body[data-theme="mosaico"] .sub,body[data-theme="mosaico"] .state,body[data-theme="mosaico"] .title,body[data-theme="mosaico"] .tog,body[data-theme="mosaico"] .search,body[data-theme="mosaico"] .me-card{padding-left:6px;padding-right:6px}
body[data-theme="mosaico"] .state{margin:18px 0 10px;line-height:1.35}
body[data-theme="mosaico"] .btn{background:var(--accent);color:var(--bg)}
body[data-theme="mosaico"] .chip.on{background:color-mix(in srgb,var(--accent) 14%,var(--tile))}
body[data-theme="mosaico"] .srow .ic{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
body[data-theme="mosaico"] .hair{background:var(--faint)}
.mo-head{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 10px}
.mo-x,.mo-add{width:48px;height:48px;border-radius:18px;background:var(--tile);display:grid;place-items:center;color:var(--text)}
.mo-add{background:var(--accent);color:var(--bg)}
.mo-greet{padding:4px 6px 0}
.mo-greet h1{font-size:40px;font-weight:500;letter-spacing:-.045em;line-height:1.05;margin-top:22px}
.mo-greet p{font-size:15px;color:var(--muted);margin-top:8px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.tile{border-radius:32px;padding:22px;text-align:left;position:relative;overflow:hidden;background:var(--tile);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s cubic-bezier(.3,1.4,.5,1);isolation:isolate}
.tile:active{transform:scale(.965)}
.tile.w2{grid-column:span 2}
.tile h3{font-size:13px;font-weight:400;color:var(--muted);display:flex;justify-content:space-between;align-items:center;letter-spacing:.01em}
.tile h3 svg{opacity:.45}
.tile .tv{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.tile .tv small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:5px}
.t-saldo{min-height:232px}
.t-saldo::before,.t-saldo::after{content:'';position:absolute;border-radius:50%;filter:blur(46px);z-index:-1}
.t-saldo::before{width:240px;height:210px;left:-70px;top:-80px;background:var(--glow1);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.t-saldo::after{width:200px;height:180px;right:-70px;bottom:-90px;background:var(--glow2);opacity:.7;animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(36px,26px) scale(1.12)}}
.t-saldo .big2{font-size:58px;font-weight:400;letter-spacing:-.055em;line-height:1;white-space:nowrap}
.t-saldo .big2 .cur{font-size:18px;color:var(--muted);vertical-align:top;margin-right:5px;letter-spacing:0;position:relative;top:8px}
.t-saldo .big2 .dec{font-size:26px;color:var(--muted)}
.t-saldo .sub2{font-size:13px;color:var(--muted);margin-top:12px}
.t-add{background:color-mix(in srgb,var(--accent) 16%,var(--tile))}
.t-add .plus{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;animation:morph 9s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:58% 42% 55% 45%/50% 58% 42% 50%}50%{border-radius:44% 56% 46% 54%/56% 44% 56% 44%}}
.t-lim .ring{position:relative;width:62px;height:62px}
.t-lim .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:500}
.t-lim .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.t-lim .tv small{white-space:nowrap}
.t-lim .ring{width:56px;height:56px}
.t-lim .ring svg{width:56px;height:56px}
.t-tx{min-height:0;gap:16px}
.t-tx .mini{display:flex;align-items:center;gap:12px;font-size:15px}
.t-tx .mini span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tx .mini small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.t-tx .mini b{font-weight:400}
.t-tx .mini b.inc{color:var(--inc)}
.t-small{min-height:128px}
body[data-theme="mosaico"] .jv-fab .core{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 55%,#fff) 0,var(--accent) 42%,color-mix(in srgb,var(--accent) 30%,#000) 100%);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 28%,transparent)}
body[data-theme="mosaico"] .jv-fab .ring{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

/* ================= JARVIS FLOTANTE ================= */
.jv-fab{position:absolute;z-index:12;width:56px;height:56px;border-radius:50%;touch-action:none;cursor:grab;transition:left .45s cubic-bezier(.3,1.3,.5,1),top .45s cubic-bezier(.3,1.3,.5,1),opacity .3s,transform .3s}
.jv-fab.drag{transition:none;cursor:grabbing;transform:scale(1.08)}
.jv-fab.hide{opacity:0;transform:scale(.4);pointer-events:none}
.jv-fab .core{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,color-mix(in srgb,var(--accent) 85%,#fff) 22%,var(--accent) 48%,color-mix(in srgb,var(--accent) 40%,#000) 100%);
  box-shadow:0 0 24px color-mix(in srgb,var(--accent) 55%,transparent);animation:fabmorph 8s ease-in-out infinite}
.jv-fab .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);animation:ring 3.2s ease-out infinite}
.jv-fab .ring:nth-child(2){animation-delay:1.6s}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes fabmorph{0%,100%{border-radius:50% 46% 54% 50%/52% 50% 50% 48%}50%{border-radius:46% 54% 48% 52%/48% 54% 46% 52%}}
@keyframes spin{to{transform:rotate(360deg)}}
.jv-tip{position:absolute;z-index:11;max-width:236px;padding:12px 15px;border-radius:18px;font-size:13px;line-height:1.45;color:var(--text);
  background:var(--sheet);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 16px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(8px) scale(.96);transition:.4s;pointer-events:none}
.jv-tip.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.jv-tip b{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:3px;letter-spacing:.02em}
.jv-win{position:absolute;left:10px;right:10px;top:46px;bottom:10px;z-index:35;border-radius:34px;background:var(--sheet);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.7);
  display:flex;flex-direction:column;padding:18px 20px 14px;opacity:0;transform:scale(.15);pointer-events:none;transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .3s}
.jv-win.open{opacity:1;transform:none;pointer-events:auto}
.jv-dim{position:absolute;inset:0;z-index:34;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s}
.jv-dim.open{opacity:1;pointer-events:auto}
.jv-head{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.jv-head b{font-size:16px;font-weight:500;font-family:var(--head)}
.jv-head small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.jv-head .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--soft)}

  box-shadow:0 0 50px color-mix(in srgb,var(--accent) 30%,transparent);transform:scale(calc(.82 + var(--lv)*.3));transition:transform .12s ease-out;animation:fabmorph 6s ease-in-out infinite}
