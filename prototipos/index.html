<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Finanzas de Edward · Mosaico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=Geist:wght@200;300;400;500;600&family=Manrope:wght@200;300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:#060607;color:#e8e8ee;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;outline:none;background:none;border:0}
svg{flex:none}

/* ================= DISEÑO MOSAICO + 5 PALETAS OSCURAS ================= */
body[data-theme="mosaico"]{--font:'Bricolage Grotesque';--num:'Bricolage Grotesque';--num-w:400;--head:'Bricolage Grotesque';--soft:rgba(255,255,255,.04);
  --bg:#000;--tile:#101010;--sheet:#141414;--text:#EDEDED;--muted:#7A7A7A;--faint:#1F1F1F;--accent:#CFCFCF;--glow1:#4A4A4A;--glow2:#2A2A2A;--inc:#A3B8A0;--exp:#C08A84;--tint:#9A9A9A}
body[data-pal="carbon"]  {--bg:#000000;--tile:#0F0F0F;--sheet:#141414;--text:#EDEDED;--muted:#767676;--faint:#1E1E1E;--accent:#D0D0D0;--glow1:#505050;--glow2:#2B2B2B;--inc:#A6B5A2;--exp:#C2918B;--tint:#9C9C9C}
body[data-pal="musgo"]   {--bg:#030403;--tile:#0E110D;--sheet:#131711;--text:#E6E9E2;--muted:#7C8575;--faint:#1C211A;--accent:#8E9E7A;--glow1:#3E4D31;--glow2:#1E2818;--inc:#9FB28C;--exp:#B98477;--tint:#8E9E7A}
body[data-pal="vino"]    {--bg:#040203;--tile:#120C0D;--sheet:#180F11;--text:#EEE6E7;--muted:#8A7A7C;--faint:#241A1C;--accent:#A3666F;--glow1:#5C2631;--glow2:#2D1419;--inc:#A9B59A;--exp:#C98078;--tint:#A3666F}
body[data-pal="petroleo"]{--bg:#020405;--tile:#0B1012;--sheet:#0F1618;--text:#E3EBEC;--muted:#74868A;--faint:#192225;--accent:#6F99A1;--glow1:#1F4751;--glow2:#12262B;--inc:#8FB3A5;--exp:#C08A80;--tint:#6F99A1}
body[data-pal="bronce"]  {--bg:#040302;--tile:#12100C;--sheet:#171410;--text:#EEE9E1;--muted:#8A8172;--faint:#24201A;--accent:#B09670;--glow1:#5C4627;--glow2:#2D2315;--inc:#A8B391;--exp:#C48775;--tint:#B09670}
/* los colores de cuentas y categorías se apagan hacia el tono de la paleta */
*{--cc:color-mix(in oklab,var(--c,#888) 30%,var(--tint,#888))}

/* ================= ESTUDIO (escritorio) ================= */
.studio{width:100%;max-width:1180px;padding:28px 24px 6px;display:flex;flex-direction:column;gap:14px;font-family:'DM Sans',Inter,sans-serif}
.studio h1{font-weight:500;font-size:21px;letter-spacing:-.02em}
.studio h1 span{color:#6d6d75;font-weight:400}
.theme-tabs{display:flex;gap:6px;flex-wrap:wrap}
.theme-tab{padding:9px 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:9px;color:#8d8d96;transition:.2s}
.theme-tab:hover{color:#fff}
.theme-tab .sw{width:12px;height:12px;border-radius:50%}
.theme-tab.on{background:#16161a;color:#fff}
.stage{display:flex;gap:56px;align-items:flex-start;justify-content:center;padding:20px 24px 50px;width:100%;max-width:1180px}
.notes{width:330px;flex:none;padding-top:24px;display:flex;flex-direction:column;gap:20px;font-size:14px;color:#9a9aa4;line-height:1.6;font-family:'DM Sans',Inter,sans-serif}
.notes h2{color:#fff;font-size:30px;letter-spacing:-.03em;font-weight:400}
.notes h4{color:#5f5f68;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.notes b{color:#ddd;font-weight:500}

/* ================= TELÉFONO ================= */
.phone{width:390px;height:830px;border-radius:54px;position:relative;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 10px #141417,0 0 0 11px #26262b,0 50px 90px rgba(0,0,0,.6);color:var(--text);font-family:var(--font),system-ui,sans-serif;isolation:isolate;flex:none;transition:background .5s}
@media (max-width:760px){
  .studio,.notes{display:none}
  .stage{padding:0}
  body{background:var(--bg)}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 26px 110px;scrollbar-width:none;z-index:2}
.screen::-webkit-scrollbar{display:none}
.phone::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,transparent,var(--bg));z-index:5;pointer-events:none}
.fade-in{animation:fin .45s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-l{animation:sl .45s cubic-bezier(.2,.9,.2,1)} .slide-r{animation:sr .45s cubic-bezier(.2,.9,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* ================= BASE COMPARTIDA ================= */
.mt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:30px}
.greet{font-size:14px;color:var(--muted)}
.greet b{color:var(--text);font-weight:500}
.back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);margin-left:-6px;padding:4px 6px}
.mnav{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.mnav button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.mnav button:disabled{opacity:.2;cursor:default}
.mnav span{min-width:70px;text-align:center;color:var(--text)}
.title{font-family:var(--head);font-size:34px;font-weight:400;letter-spacing:-.03em;margin:10px 0 4px}
.sub{font-size:14px;color:var(--muted);line-height:1.5}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 10px;font-size:13px;color:var(--muted)}
.h button{color:var(--muted);font-size:13px;border-bottom:1px solid var(--faint);padding-bottom:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none;display:inline-block}
.mono{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;letter-spacing:-.02em;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 22%,transparent);font-family:var(--font)}
.mono.s{width:18px;height:18px;border-radius:6px;font-size:9px}
.mono.l{width:38px;height:38px;border-radius:13px;font-size:14px}
.cr{padding:13px 0 0;width:100%;display:block}
.cr .l{display:flex;align-items:center;gap:12px;font-size:15px}
.cr .l span{flex:1;text-align:left}
.cr .l em{font-style:normal;font-size:12px;color:var(--muted)}
.cr .l b{font-family:var(--num);font-weight:400;font-size:15px;min-width:92px;text-align:right}
.hair{height:1px;background:var(--faint);margin-top:12px;position:relative}
.hair i{position:absolute;left:0;top:0;height:1px;background:var(--cc);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.hair.over i{background:var(--exp)}
.split{display:flex;height:4px;border-radius:4px;overflow:hidden;gap:3px;margin:18px 0 6px}
.split i{background:var(--cc);border-radius:4px}
.tr{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--faint)}
.tr .m{flex:1;min-width:0}
.tr span{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden}
.tr b{font-family:var(--num);font-weight:400;font-size:15px;white-space:nowrap}
.tr b.inc{color:var(--inc)} .tr b.mov{color:var(--muted)}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:26px 0 0;text-transform:capitalize}
.empty{color:var(--muted);padding:26px 0;font-size:14px}
.search{width:100%;margin:14px 0 4px;padding:12px 0;border-bottom:1px solid var(--faint);font-size:15px}
.search::placeholder{color:var(--muted)}
.tog{display:flex;gap:18px;margin-top:12px;font-size:14px;flex-wrap:wrap}
.tog button{color:var(--muted);padding:4px 0;position:relative}
.tog button.on{color:var(--text)}
.tog button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--accent);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:14px -26px 0;padding:0 26px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--soft);transition:.2s;white-space:nowrap;flex:none}
.chip.on{color:var(--text);background:color-mix(in srgb,var(--c,#fff) 16%,transparent)}
.chip.add{padding-left:12px;background:none;box-shadow:inset 0 0 0 1px var(--faint)}
.chip.plain{padding-left:13px}
.state{font-family:var(--head);font-size:26px;line-height:1.3;font-weight:300;letter-spacing:-.02em;margin:16px 0 6px}
.state b{font-weight:400;font-family:var(--num)}
.state em{font-style:normal;color:var(--muted)}
.over-t{color:var(--exp)!important}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--faint);width:100%;font-size:15px;text-align:left}
.srow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);flex:none}
.srow .t{flex:1;min-width:0}
.srow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.srow input{text-align:right;color:var(--text);width:150px}
.srow .chev{color:var(--muted)}
.srow .val{font-family:var(--num);font-size:15px;white-space:nowrap}
.srow.danger{color:var(--exp)}
.srow.addrow{color:var(--accent)}
.srow.addrow .ic{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.me-card{display:flex;align-items:center;gap:16px;margin:14px 0 4px}
.me-card .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--bg);background:var(--accent);font-weight:600;font-family:var(--head)}
.me-card input{font-size:22px;font-weight:400;letter-spacing:-.02em;width:100%;font-family:var(--head)}
.me-card small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.th-prev{width:36px;height:36px;border-radius:12px;flex:none}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.on>.radio{border-color:var(--text)} .on>.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--text)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--faint);position:relative;flex:none;transition:.25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.25s}
.switch.on{background:var(--accent)} .switch.on::after{left:21px;background:var(--bg)}
.foot{color:var(--muted);font-size:11px;margin-top:34px;text-align:center;opacity:.7}

/* =====================================================================
   1 · MOSAICO — sin barra. El inicio es un mosaico: cada bloque se expande
   ===================================================================== */
body[data-theme="mosaico"] .screen{padding:60px 20px 80px}
body[data-theme="mosaico"] .chips.scroll{margin:16px -20px 0;padding:0 20px}
body[data-theme="mosaico"] .title{font-weight:500;font-size:38px;letter-spacing:-.04em;margin:14px 0 6px}
body[data-theme="mosaico"] .tr{background:var(--tile);border:0;border-radius:24px;padding:16px 18px;margin-top:10px}
body[data-theme="mosaico"] .srow{background:var(--tile);border:0;border-radius:24px;padding:16px 18px;margin-top:10px}
body[data-theme="mosaico"] .cr{background:var(--tile);border-radius:24px;padding:17px 18px 16px;margin-top:10px}
body[data-theme="mosaico"] .day{margin-top:28px;padding:0 6px}
body[data-theme="mosaico"] .h{padding:0 6px;margin:40px 0 4px}
body[data-theme="mosaico"] .mt,body[data-theme="mosaico"] .sub,body[data-theme="mosaico"] .state,body[data-theme="mosaico"] .title,body[data-theme="mosaico"] .tog,body[data-theme="mosaico"] .search,body[data-theme="mosaico"] .me-card{padding-left:6px;padding-right:6px}
body[data-theme="mosaico"] .state{margin:18px 0 10px;line-height:1.35}
body[data-theme="mosaico"] .btn{background:var(--accent);color:var(--bg)}
body[data-theme="mosaico"] .chip.on{background:color-mix(in srgb,var(--accent) 14%,var(--tile))}
body[data-theme="mosaico"] .srow .ic{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
body[data-theme="mosaico"] .hair{background:var(--faint)}
.mo-head{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 10px}
.mo-x,.mo-add{width:48px;height:48px;border-radius:18px;background:var(--tile);display:grid;place-items:center;color:var(--text)}
.mo-add{background:var(--accent);color:var(--bg)}
.mo-greet{padding:4px 6px 0}
.mo-greet h1{font-size:40px;font-weight:500;letter-spacing:-.045em;line-height:1.05;margin-top:22px}
.mo-greet p{font-size:15px;color:var(--muted);margin-top:8px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.tile{border-radius:32px;padding:22px;text-align:left;position:relative;overflow:hidden;background:var(--tile);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s cubic-bezier(.3,1.4,.5,1);isolation:isolate}
.tile:active{transform:scale(.965)}
.tile.w2{grid-column:span 2}
.tile h3{font-size:13px;font-weight:400;color:var(--muted);display:flex;justify-content:space-between;align-items:center;letter-spacing:.01em}
.tile h3 svg{opacity:.45}
.tile .tv{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.tile .tv small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:5px}
.t-saldo{min-height:232px}
.t-saldo::before,.t-saldo::after{content:'';position:absolute;border-radius:50%;filter:blur(46px);z-index:-1}
.t-saldo::before{width:240px;height:210px;left:-70px;top:-80px;background:var(--glow1);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.t-saldo::after{width:200px;height:180px;right:-70px;bottom:-90px;background:var(--glow2);opacity:.7;animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(36px,26px) scale(1.12)}}
.t-saldo .big2{font-size:58px;font-weight:400;letter-spacing:-.055em;line-height:1;white-space:nowrap}
.t-saldo .big2 .cur{font-size:18px;color:var(--muted);vertical-align:top;margin-right:5px;letter-spacing:0;position:relative;top:8px}
.t-saldo .big2 .dec{font-size:26px;color:var(--muted)}
.t-saldo .sub2{font-size:13px;color:var(--muted);margin-top:12px}
.t-add{background:color-mix(in srgb,var(--accent) 16%,var(--tile))}
.t-add .plus{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;animation:morph 9s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:58% 42% 55% 45%/50% 58% 42% 50%}50%{border-radius:44% 56% 46% 54%/56% 44% 56% 44%}}
.t-lim .ring{position:relative;width:62px;height:62px}
.t-lim .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:500}
.t-lim .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.t-lim .tv small{white-space:nowrap}
.t-lim .ring{width:56px;height:56px}
.t-lim .ring svg{width:56px;height:56px}
.t-tx{min-height:0;gap:16px}
.t-tx .mini{display:flex;align-items:center;gap:12px;font-size:15px}
.t-tx .mini span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tx .mini small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.t-tx .mini b{font-weight:400}
.t-tx .mini b.inc{color:var(--inc)}
.t-small{min-height:128px}
body[data-theme="mosaico"] .jv-fab .core{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 55%,#fff) 0,var(--accent) 42%,color-mix(in srgb,var(--accent) 30%,#000) 100%);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 28%,transparent)}
body[data-theme="mosaico"] .jv-fab .ring{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

/* ================= JARVIS FLOTANTE ================= */
.jv-fab{position:absolute;z-index:12;width:56px;height:56px;border-radius:50%;touch-action:none;cursor:grab;transition:left .45s cubic-bezier(.3,1.3,.5,1),top .45s cubic-bezier(.3,1.3,.5,1),opacity .3s,transform .3s}
.jv-fab.drag{transition:none;cursor:grabbing;transform:scale(1.08)}
.jv-fab.hide{opacity:0;transform:scale(.4);pointer-events:none}
.jv-fab .core{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,color-mix(in srgb,var(--accent) 85%,#fff) 22%,var(--accent) 48%,color-mix(in srgb,var(--accent) 40%,#000) 100%);
  box-shadow:0 0 24px color-mix(in srgb,var(--accent) 55%,transparent);animation:fabmorph 8s ease-in-out infinite}
.jv-fab .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);animation:ring 3.2s ease-out infinite}
.jv-fab .ring:nth-child(2){animation-delay:1.6s}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes fabmorph{0%,100%{border-radius:50% 46% 54% 50%/52% 50% 50% 48%}50%{border-radius:46% 54% 48% 52%/48% 54% 46% 52%}}
@keyframes spin{to{transform:rotate(360deg)}}
.jv-tip{position:absolute;z-index:11;max-width:236px;padding:12px 15px;border-radius:18px;font-size:13px;line-height:1.45;color:var(--text);
  background:var(--sheet);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 16px 40px rgba(0,0,0,.6);
  opacity:0;transform:translateY(8px) scale(.96);transition:.4s;pointer-events:none}
.jv-tip.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.jv-tip b{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:3px;letter-spacing:.02em}
.jv-win{position:absolute;left:10px;right:10px;top:46px;bottom:10px;z-index:35;border-radius:34px;background:var(--sheet);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.7);
  display:flex;flex-direction:column;padding:18px 20px 14px;opacity:0;transform:scale(.15);pointer-events:none;transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .3s}
.jv-win.open{opacity:1;transform:none;pointer-events:auto}
.jv-dim{position:absolute;inset:0;z-index:34;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s}
.jv-dim.open{opacity:1;pointer-events:auto}
.jv-head{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.jv-head b{font-size:16px;font-weight:500;font-family:var(--head)}
.jv-head small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.jv-head .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--soft)}

function seedData(){
  const r=mulberry32(7),txs=[],now=new Date();
  const pick=a=>a[Math.floor(r()*a.length)],rng=(a,b)=>Math.round((a+r()*(b-a))*10)/10;
  const notes={comida:['Almuerzo','Menú del día','Café','Mercado','Cena','Pollo a la brasa','Ceviche','Panadería'],transporte:['Combi','Taxi','Mototaxi','Pasaje','Gasolina'],
    ocio:['Cine','Spotify','Salida con amigos','Juego','Netflix'],compras:['Ropa','Zapatillas','Audífonos','Mochila'],salud:['Farmacia','Consulta','Vitaminas'],
    universidad:['Copias','Separata','Libro','Pasaje a la U','Materiales'],otros:['Regalo','Propina','Varios']};
  const ranges={comida:[8,45],transporte:[2,25],ocio:[15,80],compras:[30,180],salud:[15,110],universidad:[5,60],otros:[5,40]};
  const accOf={comida:['yape','yape','efectivo'],transporte:['efectivo','efectivo','yape'],ocio:['lemon','bcp'],compras:['bcp','lemon'],salud:['yape','bcp'],universidad:['bcp','yape','efectivo'],otros:['efectivo']};
  const weights=[['comida',40],['transporte',25],['ocio',8],['compras',6],['salud',4],['universidad',8],['otros',7]];
  const wsum=weights.reduce((s,w)=>s+w[1],0);
  const wpick=()=>{let x=r()*wsum;for(const [k,w] of weights){if((x-=w)<0)return k}return 'otros'};
  let id=1;
  const add=(d,type,cat,amount,note,acc)=>txs.push({id:'s'+(id++),type,cat,amount,note,date:iso(d),acc});
  const mov=(d,amount,from,to,note)=>txs.push({id:'s'+(id++),type:'mov',amount,from,to,note,date:iso(d)});
  for(let off=-2;off<=0;off++){
    const base=new Date(now.getFullYear(),now.getMonth()+off,1),y=base.getFullYear(),m=base.getMonth();
    const last=off===0?now.getDate():daysIn(y,m);
    add(new Date(y,m,1),'ingreso','sueldo',4200,'Sueldo mensual','bcp');
    mov(new Date(y,m,1),300,'bcp','yape','Para el mes');
    if(last>=2)add(new Date(y,m,2),'gasto','casa',1200,'Alquiler','bcp');
    if(last>=3)mov(new Date(y,m,3),300,'bcp','efectivo','Retiro de cajero');
    if(last>=4)add(new Date(y,m,4),'gasto','universidad',290,'Pensión de la U','bcp');
    if(last>=5)add(new Date(y,m,5),'gasto','servicios',rng(95,140),'Luz','bcp');
    if(last>=8)add(new Date(y,m,8),'gasto','servicios',99,'Internet','bcp');
    if(last>=10)add(new Date(y,m,10),'gasto','servicios',rng(25,45),'Agua','yape');
    if(last>=15)add(new Date(y,m,15),'ingreso','freelance',Math.round(rng(500,1200)),'Proyecto web','lemon');
    if(last>=16)mov(new Date(y,m,16),200,'bcp','yape','Recarga');
    if(last>=18)mov(new Date(y,m,18),450,'lemon','bcp','Pasé a BCP');
    if(last>=17)mov(new Date(y,m,17),200,'bcp','efectivo','Retiro de cajero');
    if(last>=22&&r()>.4)add(new Date(y,m,22),'ingreso','ventas',Math.round(rng(80,300)),'Venta de garaje','yape');
    for(let d=1;d<=last;d++){const n=Math.floor(r()*3.1);for(let k=0;k<n;k++){const c=wpick();add(new Date(y,m,d),'gasto',c,rng(...ranges[c]),pick(notes[c]),pick(accOf[c]))}}
  }
  /* hábitos que se repiten (sirven para las sugerencias del formulario) */
  for(let k=1;k<=24;k++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-k),wd=d.getDay();if(wd===0||wd===6)continue;
    txs.push({id:'s'+(id++),type:'gasto',cat:'transporte',amount:3,note:'Combi a la U',date:iso(d),acc:'efectivo'});
    if(wd%2)txs.push({id:'s'+(id++),type:'gasto',cat:'comida',amount:12,note:'Menú del día',date:iso(d),acc:'yape'});
    if(wd===5)txs.push({id:'s'+(id++),type:'gasto',cat:'comida',amount:6.5,note:'Café',date:iso(d),acc:'yape'})}
  /* tarjeta de crédito: compra del mes pasado ya pagada y una compra en cuotas este mes */
  const pm=new Date(now.getFullYear(),now.getMonth()-1,12),cm=new Date(now.getFullYear(),now.getMonth(),Math.min(2,now.getDate()));
  txs.push({id:'s'+(id++),type:'gasto',cat:'compras',amount:189.9,note:'Polo y zapatillas',date:iso(pm),acc:'visa'});
  if(now.getDate()>=5)txs.push({id:'s'+(id++),type:'mov',amount:189.9,from:'bcp',to:'visa',note:'Pago de tarjeta',date:iso(new Date(now.getFullYear(),now.getMonth(),5))});
  txs.push({id:'s'+(id++),type:'gasto',cat:'compras',amount:360,note:'Audífonos',date:iso(cm),acc:'visa',cuotas:3});
  return txs;
}

function balances(until=iso(now)){
  const b={};state.accs.forEach(a=>b[a.id]=a.init||0);
  for(const t of state.txs){if(t.date>until)continue;
    if(t.type==='ingreso'){if(t.acc in b)b[t.acc]+=t.amount}
    else if(t.type==='gasto'){if(t.acc in b)b[t.acc]-=t.amount}
    else if(t.type==='mov'){if(t.from in b)b[t.from]-=t.amount;if(t.to in b)b[t.to]+=(t.amountTo??t.amount)}}
  return b;
}

function monthData(Y=state.y,M=state.m){
  const list=state.txs.filter(t=>{const d=parseISO(t.date);return d.getFullYear()===Y&&d.getMonth()===M})
    .sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  let inc=0,exp=0;const by={},mk=Y*12+M;
  for(const t of list)if(t.type==='ingreso')inc+=toPEN(t.amount,t.acc);
  for(const t of state.txs){if(t.type!=='gasto')continue;const d=parseISO(t.date),k=mk-(d.getFullYear()*12+d.getMonth()),n=t.cuotas||1;
    if(k<0||k>=n)continue;const v=toPEN(t.amount,t.acc)/n;exp+=v;by[t.cat]=(by[t.cat]||0)+v}
  const byCat=Object.entries(by).map(([cat,total])=>({cat,total})).sort((a,b)=>b.total-a.total);
  const ratio=inc?exp/inc:(exp?1.2:0);
  const mood=ratio<.6?{k:'good',t:'Vas muy bien'}:ratio<.9?{k:'mid',t:'Vas justo'}:{k:'bad',t:'Te estás pasando'};
  return{list,inc,exp,bal:inc-exp,byCat,ratio,mood};
}

function applyRecs(){
  const t=new Date(),cur=mkey(t),added=[];
  for(const r of state.recs){
    if(!r.active)continue;r.done=r.done||[];
    let [y,m]=(r.start||cur).split('-').map(Number);m--;
    for(let guard=0;guard<36;guard++){
      const k=`${y}-${pad2(m+1)}`;if(k>cur)break;
      const day=Math.min(r.day,daysIn(y,m));
      if(!r.done.includes(k)&&(k<cur||day<=t.getDate())&&state.accs.some(a=>a.id===r.acc)){
        const tx={id:'r'+Date.now()+Math.floor(Math.random()*1e4),type:r.type,amount:r.amount,cat:r.cat,acc:r.acc,note:r.name,date:`${k}-${pad2(day)}`,rec:r.id};
        state.txs.push(tx);r.done.push(k);added.push(r);
      }
      m++;if(m>11){m=0;y++}
    }
  }
  if(added.length){persist();setTimeout(()=>toast(added.length===1?`${added[0].name} se anotó solo (gasto fijo)`:`${added.length} gastos fijos se anotaron solos`),900)}

function upcoming(days=31){

/* Ciclos: cada compra cae en el estado de cuenta que cierra en el siguiente día de corte.

function cardInfo(a){
  const t=new Date(),T=new Date(t.getFullYear(),t.getMonth(),t.getDate()),cd=a.closeDay||20,pd=a.payDay||5,bal=balances()[a.id]||0,debt=Math.max(0,-bal);
  const ymd=(ym,day)=>{const y=Math.floor(ym/12),m=ym%12;return new Date(y,m,Math.min(day,daysIn(y,m)))};
  const stmt=x=>{const ym=x.getFullYear()*12+x.getMonth();return x.getDate()<=Math.min(cd,daysIn(x.getFullYear(),x.getMonth()))?ym:ym+1};
  const closeOf=s=>ymd(s,cd),payOf=s=>ymd(pd>cd?s:s+1,pd);
  let s=stmt(T)-2;while(payOf(s)<T)s++;
  const buys=state.txs.filter(x=>x.type==='gasto'&&x.acc===a.id);let charge=0;const plans=[];
  for(const x of buys){const s0=stmt(parseISO(x.date)),n=x.cuotas||1,k=s-s0;if(k>=0&&k<n){charge+=x.amount/n;if(n>1)plans.push({tx:x,n,i:k+1,per:x.amount/n})}}
  const prevPay=payOf(s-1),paid=state.txs.filter(x=>x.type==='mov'&&x.to===a.id&&parseISO(x.date)>prevPay&&parseISO(x.date)<=T).reduce((v,x)=>v+(x.amountTo??x.amount),0);
  const due=Math.round(Math.max(0,Math.min(debt,charge-paid))*100)/100,closeDate=closeOf(s);

function streak(){
  const days=new Set(state.txs.map(t=>t.date)),d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(iso(d))&&n<999){n++;d.setDate(d.getDate()-1)}return n;

function templates(){
  const since=iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()-60)),g={};
  for(const t of state.txs){if(t.type!=='gasto'||t.date<since||t.rec||t.cuotas>1||!t.note)continue;const k=`${norm(t.note)}|${t.cat}|${t.acc}`;
    const e=(g[k]=g[k]||{n:0,am:{},best:t});e.n++;e.am[t.amount]=(e.am[t.amount]||0)+1;
    const cb=e.am[e.best.amount]||0,cn=e.am[t.amount];if(cn>cb||(cn===cb&&t.date>=e.best.date))e.best=t}
  return Object.values(g).filter(x=>x.n>=3).sort((a,b)=>b.n-a.n||b.best.date.localeCompare(a.best.date)).slice(0,4).map(x=>x.best);

let returnTo=null;
function openSheet(html,cls=''){const sh=$('#sheet');sh.className='sheet '+cls;sh.innerHTML=`<div class="handle"></div>${html}`;sh.scrollTop=0;$('#sheetWrap').classList.add('open')}
function closeSheet(){$('#sheetWrap').classList.remove('open');returnTo=null;form=null}
function backOrClose(){if(returnTo){const f=returnTo;returnTo=null;f()}else closeSheet()}
const swatches=(cur,attr='data-color')=>`<div class="swatches">${PALETTE.concat(['#7FA6FF','#B794FF','#D9F27E','#5FD6E3']).filter((c,i,a)=>a.indexOf(c)===i).map(c=>`<button class="${cur===c?'on':''}" ${attr}="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}</div>`;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900)}

/* ---------- registrar / editar movimiento ---------- */
let form=null;
function openForm(type='gasto',tx){
  if(type==='mov'&&state.accs.length<2){toast('Necesitas al menos dos cuentas');openAccForm(null);return}
  form=tx?{...tx,amount:String(tx.amount),cuotas:tx.cuotas||1}:{id:null,type,amount:'',cat:null,acc:null,from:null,to:null,note:'',date:iso(isCurrentMonth()?now:new Date(state.y,state.m,1)),cuotas:1,rep:false,split:false,names:''};
  drawForm();setTimeout(()=>$('#amt')?.focus(),350);
}
function drawForm(){
  const t=form.type,accs=state.accs,has=id=>accs.some(a=>a.id===id);
  if(t!=='mov'){
    const cats=catsOf(t);if(!cats.some(c=>c.id===form.cat))form.cat=cats[0]?.id||null;
    if(!has(form.acc))form.acc=has(state.user.lastAcc[t])?state.user.lastAcc[t]:accs[0]?.id;
  }else{
    if(!has(form.from))form.from=has(state.user.lastAcc.gasto)&&accs.length>1?accs.find(a=>a.kind==='banco')?.id||accs[0].id:accs[0]?.id;
    if(!has(form.to)||form.to===form.from)form.to=accs.find(a=>a.id!==form.from)?.id;
  }
  const accChips=(key,label)=>`<div class="lab"><span>${label}</span></div><div class="chips">${accs.map(a=>`<button class="chip ${form[key]===a.id?'on':''}" data-facc="${key}:${a.id}" style="--c:${a.color}">${monoEl(a,'s')}${esc(a.name)}</button>`).join('')}<button class="chip add" data-act="newacc-f" data-key="${key}">${svg('plus',14)}Cuenta</button></div>`;
  const cats=t==='mov'?'':`<div class="lab"><span>Categoría</span></div><div class="chips">${catsOf(t).map(c=>`<button class="chip plain ${form.cat===c.id?'on':''}" data-fcat="${c.id}" style="--c:${c.color}">${dotEl(c.id)}${esc(c.name)}</button>`).join('')}<button class="chip add" data-act="newcat-f">${svg('plus',14)}Categoría</button></div>`;
  const tp=!form.id&&t==='gasto'?templates():[],acc=accById(form.acc),isCard=t==='gasto'&&acc.kind==='credito',cur=curOf(t==='mov'?form.from:form.acc);
  if(!isCard)form.cuotas=1;
  const opts=form.id||t==='mov'?'':`<div class="lab"><span>Opciones</span></div>
    <button class="opt" data-act="frep"><div>Repetir cada mes<small>${form.rep?`Se anotará solo el día ${parseISO(form.date||iso(now)).getDate()} de cada mes`:'Alquiler, pensión, suscripciones…'}</small></div><span class="switch ${form.rep?'on':''}"></span></button>
    ${t==='gasto'?`<button class="opt" data-act="fsplit"><div>Dividir con amigos<small>Anota cuánto te debe cada uno</small></div><span class="switch ${form.split?'on':''}"></span></button>
    ${form.split?`<input class="field" id="splitNames" placeholder="¿Con quiénes? Ej. Carlos, Ana" value="${esc(form.names)}"><div class="cuo-note" id="splitNote">${splitNote()}</div>`:''}`:''}`;
  openSheet(`<div class="seg">${[['gasto','Gasto'],['ingreso','Ingreso'],['mov','Mover']].map(([k,l])=>`<button data-type="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>
    ${tp.length?`<div class="tpl">${tp.map(x=>`<button data-tpl="${x.id}">${esc(x.note)}<small>${txMoney(x)} · ${esc(accById(x.acc).name)}</small></button>`).join('')}</div>`:''}
    <div class="amount"><span>${symOf(cur)}</span><input id="amt" inputmode="decimal" placeholder="0.00" value="${esc(form.amount)}"></div>
    <div class="quick">${[5,10,20,50,100].map(v=>`<button data-quick="${v}">+${v}</button>`).join('')}</div>
    ${t==='gasto'?accChips('acc','¿Con qué pagaste?'):t==='ingreso'?accChips('acc','¿A dónde entró?'):accChips('from','Sale de')+accChips('to','Entra a')}
    ${isCard?`<div class="lab"><span>Cuotas</span><span>sin intereses</span></div><div class="cuo">${[1,3,6,12].map(n=>`<button data-cuotas="${n}" class="${form.cuotas===n?'on':''}">${n===1?'Una sola':n}</button>`).join('')}</div><div class="cuo-note" id="cuoNote">${cuoNote()}</div>`:''}
    ${t==='mov'&&curOf(form.from)!==curOf(form.to)?`<div class="hint" id="fxHint">${fxHint()}</div>`:''}
    ${cats}
    <div class="lab"><span>Detalle</span></div>
    <div class="row2"><input class="field" id="note" placeholder="${t==='mov'?'Ej. Retiro de cajero':'Nota (opcional)'}" value="${esc(form.note)}"><input class="field" id="date" type="date" value="${form.date}" max="${iso(now)}"></div>
    ${opts}
    <button class="btn" data-act="save">${form.id?'Guardar cambios':t==='gasto'?'Registrar gasto':t==='ingreso'?'Registrar ingreso':'Mover dinero'}</button>
    ${form.id?`<button class="btn ghost" data-act="del">${svg('trash',18)}Eliminar movimiento</button>`:''}`);
}
function syncForm(){if(!form)return;const a=$('#amt'),n=$('#note'),dt=$('#date'),sn=$('#splitNames');if(a)form.amount=a.value;if(n)form.note=n.value;if(dt)form.date=dt.value;if(sn)form.names=sn.value}
const amtVal=()=>parseFloat(String(form.amount).replace(',','.'))||0;
const splitNames=()=>String(form.names||'').split(/,|\sy\s/).map(x=>x.trim()).filter(Boolean);
function splitNote(){const n=splitNames().length,v=amtVal();return n&&v?`Son ${n+1} contándote · cada uno te debe ${money(v/(n+1))}`:'Escribe los nombres separados por coma'}
function cuoNote(){const v=amtVal(),n=form.cuotas||1;return n>1?(v?`${n} cuotas de ${money(v/n)} · en tu mes solo cuenta la cuota`:`Se reparte en ${n} meses`):'Se cobra completo en tu próximo pago'}
function fxRate(from,to){const r=state.user.rate||3.4;return curOf(from)===curOf(to)?1:curOf(from)==='USD'?r:1/r}
function fxHint(){const v=amtVal(),to=accById(form.to);return `Llegan <b>${accMoney(v*fxRate(form.from,form.to),form.to)}</b> a ${esc(to.name)} · US$ 1 = S/ ${state.user.rate.toFixed(2)}`}
function liveForm(){syncForm();const c=$('#cuoNote'),f=$('#fxHint'),s=$('#splitNote');if(c)c.textContent=cuoNote();if(f)f.innerHTML=fxHint();if(s)s.textContent=splitNote()}
function saveForm(){
  syncForm();const amount=parseFloat(String(form.amount).replace(',','.'));
  if(!(amount>0)){toast('Ingresa un monto válido');$('#amt')?.focus();return}
  const base={id:form.id||('t'+Date.now()),type:form.type,amount:Math.round(amount*100)/100,note:form.note.trim(),date:form.date||iso(now)};
  let tx;
  if(form.type==='mov'){if(!form.from||!form.to||form.from===form.to){toast('Elige dos cuentas distintas');return}tx={...base,from:form.from,to:form.to,note:base.note||'Entre cuentas'};
    const fx=fxRate(form.from,form.to);if(fx!==1)tx.amountTo=Math.round(base.amount*fx*100)/100;
    if(accById(form.to).kind==='credito'&&!form.note.trim())tx.note='Pago de tarjeta'}
  else{if(!form.cat){toast('Elige o crea una categoría');return}if(!form.acc){toast('Elige o crea una cuenta');return}tx={...base,cat:form.cat,acc:form.acc};state.user.lastAcc[form.type]=form.acc;
    if(form.type==='gasto'&&accById(form.acc).kind==='credito'&&form.cuotas>1)tx.cuotas=form.cuotas;
    if(form.rec)tx.rec=form.rec}
  const editing=!!form.id,names=form.split&&form.type==='gasto'&&!editing?splitNames():[];
  if(form.split&&form.type==='gasto'&&!editing&&!names.length){toast('Escribe con quién lo divides');$('#splitNames')?.focus();return}
  if(editing){const i=state.txs.findIndex(t=>t.id===form.id);state.txs[i]=tx}else state.txs.push(tx);
  let extra='';
  if(!editing&&form.rep&&tx.type!=='mov'){const d=parseISO(tx.date),name=tx.note||catById(tx.cat).name,r={id:uid('r-',name),name,type:tx.type,amount:tx.amount,cat:tx.cat,acc:tx.acc,day:d.getDate(),active:true,start:mkey(d),done:[mkey(d)]};
    state.recs.push(r);tx.rec=r.id;applyRecs();extra=` · se repetirá el día ${r.day}`}
  if(names.length){const share=Math.round(tx.amount/(names.length+1)*100)/100;
    names.forEach((n,i)=>state.debts.push({id:'d'+Date.now()+i,person:cap(n),dir:'medeben',amount:share,note:tx.note||catById(tx.cat).name,date:tx.date,paid:false}));extra=` · cada uno te debe ${money(share)}`}
  const d=parseISO(tx.date);state.y=d.getFullYear();state.m=d.getMonth();
  persist();closeSheet();render(true);
  toast(editing?'Cambios guardados':(tx.type==='gasto'?(tx.cuotas?`En ${tx.cuotas} cuotas de ${money(tx.amount/tx.cuotas)}`:`Gasto registrado · ${accById(tx.acc).name}`):tx.type==='ingreso'?`Ingreso registrado · ${accById(tx.acc).name}`:`Movido a ${accById(tx.to).name}`)+extra);
}

/* ---------- cuentas ---------- */
let accF=null;
function openAccForm(id,opts={}){
  const a=id?state.accs.find(x=>x.id===id):null,bal=balances();
  accF=a?{id:a.id,name:a.name,kind:a.kind,color:a.color,currency:a.currency||'PEN',limit:String(a.limit||''),closeDay:String(a.closeDay||''),payDay:String(a.payDay||''),saldo:String(Math.round((a.kind==='credito'?-1:1)*(bal[a.id]||0)*100)/100),confirm:false}:{id:null,name:'',kind:'banco',color:PALETTE[state.accs.length%PALETTE.length],currency:'PEN',limit:'',closeDay:'20',payDay:'5',saldo:'',confirm:false};
  if(opts.key)accF.key=opts.key;
  drawAccForm();
}
function drawAccForm(){
  const f=accF,used=new Set(state.accs.map(a=>norm(a.name)));
  const n=f.id?state.txs.filter(t=>t.acc===f.id||t.from===f.id||t.to===f.id).length:0,other=state.accs.find(a=>a.id!==f.id);
  openSheet(`<div class="sh-title">${f.id?'Editar cuenta':'Nueva cuenta'}</div><div class="sh-sub">${f.id?'Cambia el nombre, tipo, color o corrige el saldo':'Banco, billetera digital, tarjeta o efectivo'}</div>
    ${f.id?'':`<div class="lab"><span>Rápido</span></div><div class="chips">${ACC_PRESETS.filter(p=>!used.has(norm(p[0]))).map(p=>`<button class="chip ${norm(f.name)===norm(p[0])?'on':''}" data-preset="${esc(p[0])}" style="--c:${p[2]}">${monoEl({name:p[0],color:p[2]},'s')}${esc(p[0])}</button>`).join('')}</div>`}
    <div class="lab"><span>Nombre</span></div><input class="field" id="accName" placeholder="Ej. BCP sueldo, Yape, Billetera" value="${esc(f.name)}" maxlength="22">
    <div class="lab"><span>Tipo</span></div><div class="chips">${Object.entries(KINDS).map(([k,l])=>`<button class="chip plain ${f.kind===k?'on':''}" data-kind="${k}">${l}</button>`).join('')}</div>
    ${f.kind==='credito'?`<div class="lab"><span>Línea de crédito · día de corte · día de pago</span></div><div class="grid3"><input class="field" id="cLimit" inputmode="decimal" placeholder="Línea S/" value="${esc(f.limit)}"><input class="field" id="cClose" type="number" min="1" max="31" placeholder="Corte" value="${esc(f.closeDay)}"><input class="field" id="cPay" type="number" min="1" max="31" placeholder="Pago" value="${esc(f.payDay)}"></div>`
      :`<div class="lab"><span>Moneda</span></div><div class="chips"><button class="chip plain ${f.currency!=='USD'?'on':''}" data-cur="PEN">Soles · S/</button><button class="chip plain ${f.currency==='USD'?'on':''}" data-cur="USD">Dólares · US$</button></div>`}
    <div class="lab"><span>Color</span></div>${swatches(f.color)}
    <div class="lab"><span>${f.kind==='credito'?'¿Cuánto debes ahora?':f.id?'Saldo actual (corrígelo si no cuadra)':'¿Cuánto tienes ahora?'}</span></div>
    <div class="amount" style="margin:6px 0 0"><span>${f.kind==='credito'?'S/':symOf(f.currency)}</span><input id="accSaldo" inputmode="decimal" placeholder="0.00" value="${esc(f.saldo)}"></div>
    <button class="btn" data-act="saveacc">${f.id?'Guardar cuenta':'Añadir cuenta'}</button>
    ${f.id?`<button class="btn soft" data-act="accviewtx" data-id="${f.id}">Ver sus movimientos</button>`:''}
    ${f.id&&state.accs.length>1?`<button class="btn ghost" data-act="delacc">${svg('trash',18)}${f.confirm?'Toca otra vez para quitarla':'Quitar cuenta'}</button>${f.confirm&&n?`<div class="warn">Sus ${n} movimientos pasarán a ${esc(other.name)}.</div>`:''}`:''}
    ${returnTo?`<button class="btn soft" data-act="sheetback">Volver</button>`:''}`);
}
function syncAcc(){const n=$('#accName'),s=$('#accSaldo');if(n)accF.name=n.value;if(s)accF.saldo=s.value;for(const [k,i] of [['limit','cLimit'],['closeDay','cClose'],['payDay','cPay']]){const e=$('#'+i);if(e)accF[k]=e.value}}
function saveAcc(){
  syncAcc();const name=accF.name.trim();if(!name){toast('Ponle un nombre');$('#accName')?.focus();return}
  if(state.accs.some(a=>a.id!==accF.id&&norm(a.name)===norm(name))){toast('Ya tienes una cuenta con ese nombre');return}
  const cc=accF.kind==='credito',saldo=(cc?-1:1)*(parseFloat(String(accF.saldo||'0').replace(',','.'))||0);let id=accF.id;
  const extra=cc?{currency:'PEN',limit:parseFloat(String(accF.limit).replace(',','.'))||0,closeDay:clamp(Math.round(+accF.closeDay)||20,1,31),payDay:clamp(Math.round(+accF.payDay)||5,1,31)}:{currency:accF.currency};
  if(id){const a=state.accs.find(x=>x.id===id),cur=balances()[id]||0;Object.assign(a,{name,kind:accF.kind,color:accF.color},extra);if(!cc){delete a.limit;delete a.closeDay;delete a.payDay}a.init=Math.round(((a.init||0)+saldo-cur)*100)/100}
  else{id=uid('',name);state.accs.push({id,name,kind:accF.kind,color:accF.color,...extra,init:Math.round(saldo*100)/100})}
  persist();toast(accF.id?'Cuenta actualizada':`${name} añadida`);
  if(returnTo&&form&&accF.key){form[accF.key]=id;const f=returnTo;returnTo=null;render(true);f();return}
  closeSheet();render(true);
}
function delAcc(){
  if(!accF.confirm){accF.confirm=true;syncAcc();drawAccForm();return}
  const id=accF.id,other=state.accs.find(a=>a.id!==id);
  state.txs.forEach(t=>{if(t.acc===id)t.acc=other.id;if(t.from===id)t.from=other.id;if(t.to===id)t.to=other.id});
  state.txs=state.txs.filter(t=>!(t.type==='mov'&&t.from===t.to));
  const a=state.accs.find(x=>x.id===id);other.init=(other.init||0)+(a.init||0);
  state.accs=state.accs.filter(x=>x.id!==id);
  for(const k of ['gasto','ingreso'])if(state.user.lastAcc[k]===id)state.user.lastAcc[k]=other.id;
  if(state.accFilter===id)state.accFilter='all';
  persist();closeSheet();render(true);toast(`${a.name} quitada`);
}

/* ---------- categorías ---------- */
let catF=null;
function openCatForm(id,type){
  const c=id?state.cats.find(x=>x.id===id):null;type=c?c.type:(type||state.catTab);
  const usedColors=new Set(catsOf(type).map(x=>x.color));
  catF=c?{id:c.id,name:c.name,type,color:c.color,bud:String(state.budgets[c.id]||''),confirm:false}:{id:null,name:'',type,color:PALETTE.find(p=>!usedColors.has(p))||PALETTE[0],bud:'',confirm:false};
  drawCatForm();
}
function drawCatForm(){
  const f=catF,used=new Set(state.cats.map(c=>norm(c.name)));
  const n=f.id?state.txs.filter(t=>t.cat===f.id).length:0,fb=fallbackCat(f.id,f.type);
  openSheet(`<div class="sh-title">${f.id?'Editar categoría':`Nueva categoría de ${f.type}`}</div>
    ${f.id?'':`<div class="lab"><span>Ideas</span></div><div class="chips">${CAT_SUGG[f.type].filter(s=>!used.has(norm(s))).map(s=>`<button class="chip plain ${f.name===s?'on':''}" data-csugg="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
    <div class="lab"><span>Nombre</span></div><input class="field" id="catName" placeholder="Ej. Universidad, Mascotas" value="${esc(f.name)}" maxlength="22">
    <div class="lab"><span>Color</span></div>${swatches(f.color)}
    ${f.type==='gasto'?`<div class="lab"><span>Límite mensual (opcional)</span></div><div class="amount" style="margin:6px 0 0"><span>S/</span><input id="catBud" inputmode="decimal" placeholder="sin límite" value="${esc(f.bud)}"></div>`:''}
    <button class="btn" data-act="savecat">${f.id?'Guardar':'Crear categoría'}</button>
    ${f.id&&fb?`<button class="btn ghost" data-act="delcat">${svg('trash',18)}${f.confirm?'Toca otra vez para quitarla':'Quitar categoría'}</button>${f.confirm&&n?`<div class="warn">Sus ${n} movimientos pasarán a ${esc(fb.name)}.</div>`:''}`:''}
    ${returnTo?`<button class="btn soft" data-act="sheetback">Volver</button>`:''}`);
}
function fallbackCat(id,type){const list=catsOf(type).filter(c=>c.id!==id);return list.find(c=>c.id==='otros'||c.id==='extra')||list.at(-1)}
function syncCat(){const n=$('#catName'),b=$('#catBud');if(n)catF.name=n.value;if(b)catF.bud=b.value}
function saveCat(){
  syncCat();const name=catF.name.trim();if(!name){toast('Ponle un nombre');$('#catName')?.focus();return}
  if(state.cats.some(c=>c.id!==catF.id&&c.type===catF.type&&norm(c.name)===norm(name))){toast('Esa categoría ya existe');return}
  let id=catF.id;
  if(id)Object.assign(state.cats.find(c=>c.id===id),{name,color:catF.color});
  else{id=uid('',name);const i=state.cats.findIndex(c=>c.type===catF.type&&(c.id==='otros'||c.id==='extra'));const nc={id,name,type:catF.type,color:catF.color};if(i>=0)state.cats.splice(i,0,nc);else state.cats.push(nc)}
  if(catF.type==='gasto'){const b=parseFloat(String(catF.bud).replace(',','.'));if(b>0)state.budgets[id]=Math.round(b*100)/100;else delete state.budgets[id]}
  persist();toast(catF.id?'Categoría actualizada':`${name} creada`);
  if(returnTo&&form){form.cat=id;form.type=catF.type;const f=returnTo;returnTo=null;render(true);f();return}
  closeSheet();render(true);
}
function delCat(){
  if(!catF.confirm){catF.confirm=true;syncCat();drawCatForm();return}
  const id=catF.id,fb=fallbackCat(id,catF.type),c=catById(id);
  state.txs.forEach(t=>{if(t.cat===id)t.cat=fb.id});state.cats=state.cats.filter(x=>x.id!==id);delete state.budgets[id];
  persist();closeSheet();render(true);toast(`${c.name} quitada`);
}

/* ---------- límites ---------- */
function openBudget(id){
  const c=catById(id),d=monthData(),sp=d.byCat.find(x=>x.cat===id)?.total||0;
  openSheet(`<div class="sh-title" style="display:flex;align-items:center;justify-content:center;gap:10px">${dotEl(id)}${esc(c.name)}</div><div class="sh-sub">Límite mensual · llevas ${money(sp)} en ${MONTHS[state.m]}</div>
  <div class="amount"><span>S/</span><input id="bud" inputmode="decimal" placeholder="0" value="${state.budgets[id]||''}"></div>
  <div class="quick">${[100,200,300,500,1000].map(v=>`<button data-budq="${v}">${v}</button>`).join('')}</div>
  <button class="btn" data-act="savebud" data-id="${id}">Guardar límite</button>${state.budgets[id]?`<button class="btn soft" data-act="nobud" data-id="${id}">Quitar límite</button>`:''}
  <button class="btn soft" data-act="editcat" data-id="${id}">Editar categoría</button>`);
  setTimeout(()=>$('#bud')?.focus(),350);
}
function confirmSheet(title,text,act,label){openSheet(`<div class="sh-title">${title}</div><div class="sh-sub" style="margin-top:10px;line-height:1.5">${text}</div><button class="btn" data-act="${act}" style="background:var(--exp)">${label}</button><button class="btn soft" data-act="sheetclose">Cancelar</button>`)}
/* ================== EVENTOS ================== */
let noClickUntil=0;
document.addEventListener('click',e=>{
  if(Date.now()<noClickUntil){e.preventDefault();return}
  const el=e.target.closest('button,[data-act],[data-tile],.jv-tip');if(!el)return;
  if(el.id==='jvTip'){openJarvis();return}
  const ds=el.dataset;
  if(ds.themeSet){state.theme=ds.themeSet;persist();render();return}
  if(ds.tabk){go(ds.tabk);return}
  if(ds.lk){lockKey(ds.lk);return}
  if(ds.pk&&pinF){pinKey(ds.pk);return}
  if(ds.onbacc&&onb){const n=$('#onbName');if(n)onb.name=n.value.trim();const i=onb.accs.indexOf(ds.onbacc);if(i>=0)onb.accs.splice(i,1);else onb.accs.push(ds.onbacc);drawOnb();return}
  if(ds.onbpal&&onb){onb.pal=ds.onbpal;document.body.dataset.pal=ds.onbpal;drawOnb();return}
  if(ds.tile){expandFrom(el,ds.tile);return}
  if(ds.isla){islaToggle(ds.isla==='close'?false:undefined);return}
  if(ds.islaGo){go(ds.islaGo);return}
  if(ds.hl){hlJump(ds.hl);return}
  if(ds.cattabNew){state.catTab=ds.cattabNew;el.dataset.act='newcat'}
  if(el.closest('.isla-panel'))islaToggle(false);
  if(ds.go){go(ds.go);return}
  if(ds.month){const d=new Date(state.y,state.m+(+ds.month),1);if(d>new Date(now.getFullYear(),now.getMonth(),1))return;state.y=d.getFullYear();state.m=d.getMonth();render(true);return}
  if(ds.filter){state.filter=ds.filter;render(true);return}
  if(ds.accf){state.accFilter=ds.accf;render(true);return}
  if(ds.accview){state.accFilter=ds.accview;state.filter='all';go('txs');return}
  if(ds.cattab){state.catTab=ds.cattab;render(true);return}
  if(ds.catedit){openCatForm(ds.catedit);return}
  if(ds.accedit){openAccForm(ds.accedit);return}
  if(ds.card){openCard(ds.card);return}
  if(ds.rec){openRecForm(ds.rec);return}
  if(ds.rtype&&recF){syncRec();recF.type=ds.rtype;drawRecForm();return}
  if(ds.racc&&recF){syncRec();recF.acc=ds.racc;drawRecForm();return}
  if(ds.rcat&&recF){syncRec();recF.cat=ds.rcat;document.querySelectorAll('[data-rcat]').forEach(c=>c.classList.toggle('on',c.dataset.rcat===ds.rcat));return}
  if(ds.goaladd){openGoalAdd(ds.goaladd);return}
  if(ds.goaledit){openGoalForm(ds.goaledit);return}
  if(ds.gsugg&&goalF){syncGoal();goalF.name=ds.gsugg;drawGoalForm();return}
  if(ds.gq){$('#gAmt').value=ds.gq;return}
  if(ds.debt){openDebtForm(ds.debt);return}
  if(ds.ddir&&debtF){syncDebt();debtF.dir=ds.ddir;drawDebtForm();return}
  if(ds.dperson&&debtF){$('#dPerson').value=ds.dperson;debtF.person=ds.dperson;return}
  if(ds.restore){const b=backups()[+ds.restore];if(b){restoreIx=+ds.restore;confirmSheet('¿Volver a esta copia?',`Tus datos quedarán como estaban el ${dayLabel(b.date).toLowerCase()} (${b.n} movimientos). Lo de después se pierde.`,'dorestore','Restaurar copia')}return}
  if(ds.bud){openBudget(ds.bud);return}
  if(ds.tx){const t=state.txs.find(x=>x.id===ds.tx);if(t)openForm(t.type,t);return}
  if(ds.sugg){sendJarvis(ds.sugg);return}
  if(ds.undo){undoTx(ds.undo);return}
  /* formulario de movimiento */
  if(ds.type&&form){syncForm();form.type=ds.type;if(ds.type==='mov'&&state.accs.length<2){toast('Necesitas al menos dos cuentas');form.type='gasto'}drawForm();return}
  if(ds.facc&&form){syncForm();const [k,id]=ds.facc.split(':');form[k]=id;if(form.type==='mov'&&form.from===form.to){const o=state.accs.find(a=>a.id!==id);if(k==='from')form.to=o.id;else form.from=o.id}drawForm();return}
  if(ds.fcat&&form){syncForm();form.cat=ds.fcat;document.querySelectorAll('[data-fcat]').forEach(c=>c.classList.toggle('on',c.dataset.fcat===ds.fcat));return}
  if(ds.tpl&&form){const x=state.txs.find(t=>t.id===ds.tpl);if(x){Object.assign(form,{amount:String(x.amount),note:x.note,cat:x.cat,acc:x.acc});drawForm();toast('Listo, revisa y registra')}return}
  if(ds.cuotas&&form){syncForm();form.cuotas=+ds.cuotas;drawForm();return}
  if(ds.cur&&accF){syncAcc();accF.currency=ds.cur;drawAccForm();return}
  if(ds.quick){const a=$('#amt');a.value=String(Math.round(((parseFloat(String(a.value).replace(',','.'))||0)+(+ds.quick))*100)/100);liveForm();return}
  /* formularios de cuenta y categoría */
  if(ds.preset&&accF){const p=ACC_PRESETS.find(x=>x[0]===ds.preset);syncAcc();Object.assign(accF,{name:p[0],kind:p[1],color:p[2],currency:p[0].includes('$')?'USD':'PEN'});drawAccForm();return}
  if(ds.kind&&accF){syncAcc();accF.kind=ds.kind;drawAccForm();return}
  if(ds.csugg&&catF){syncCat();catF.name=ds.csugg;drawCatForm();return}
  if(ds.color){if($('#accName')&&accF){syncAcc();accF.color=ds.color;drawAccForm()}else if(catF){syncCat();catF.color=ds.color;drawCatForm()}return}
  if(ds.budq){$('#bud').value=ds.budq;return}
  const act=ds.act;if(!act)return;
  switch(act){
    case 'add':openForm('gasto');break;
    case 'newmov':openForm('mov');break;
    case 'save':saveForm();break;
    case 'del':state.txs=state.txs.filter(t=>t.id!==form.id);persist();closeSheet();render(true);toast('Movimiento eliminado');break;
    case 'newacc':returnTo=null;openAccForm(null);break;
    case 'newacc-f':syncForm();returnTo=drawForm;openAccForm(null,{key:ds.key});break;
    case 'saveacc':saveAcc();break;
    case 'delacc':delAcc();break;
    case 'accviewtx':state.accFilter=ds.id;state.filter='all';closeSheet();go('txs');break;
    case 'newcat':returnTo=null;openCatForm(null,state.catTab);break;
    case 'newcat-g':returnTo=null;openCatForm(null,'gasto');break;
    case 'newcat-f':syncForm();returnTo=drawForm;openCatForm(null,form.type);break;
    case 'editcat':openCatForm(ds.id);break;
    case 'savecat':saveCat();break;
    case 'delcat':delCat();break;
    case 'sheetback':backOrClose();break;
    case 'sheetclose':closeSheet();break;
    case 'savebud':{const v=parseFloat(String($('#bud').value).replace(',','.'));if(v>0)state.budgets[ds.id]=Math.round(v*100)/100;else delete state.budgets[ds.id];persist();closeSheet();render(true);toast('Límite guardado');break}
    case 'nobud':delete state.budgets[ds.id];persist();closeSheet();render(true);toast('Límite quitado');break;
    case 'hide':state.user.hide=!state.user.hide;persist();render(true);toast(state.user.hide?'Montos ocultos':'Montos visibles');break;
    case 'rate':openRate();break;
    case 'saverate':{const v=parseFloat(String($('#rate').value).replace(',','.'));if(!(v>0)){toast('Ingresa un número válido');break}state.user.rate=Math.round(v*1000)/1000;persist();closeSheet();render(true);toast(`US$ 1 = S/ ${state.user.rate.toFixed(2)}`);break}
    case 'pin':pinF=null;openPin();break;
    case 'pinchange':pinF={step:1,a:'',b:''};openPin();break;
    case 'pinoff':state.user.pin=null;persist();closeSheet();render(true);toast('PIN quitado');break;
    case 'story':openStory();break;
    case 'storyclose':$('#story').classList.remove('open');break;
    case 'newrec':openRecForm(null);break;
    case 'saverec':saveRec();break;
    case 'recactive':syncRec();recF.active=!recF.active;drawRecForm();break;
    case 'recnow':syncRec();recF.now=!recF.now;drawRecForm();break;
    case 'delrec':if(!recF.confirm){syncRec();recF.confirm=true;drawRecForm();break}state.recs=state.recs.filter(r=>r.id!==recF.id);persist();closeSheet();render(true);toast('Gasto fijo quitado');break;
    case 'newgoal':openGoalForm(null);break;
    case 'savegoal':saveGoal();break;
    case 'delgoal':if(!goalF.confirm){syncGoal();goalF.confirm=true;drawGoalForm();break}state.goals=state.goals.filter(g=>g.id!==goalF.id);persist();closeSheet();render(true);toast('Meta quitada');break;
    case 'goalput':goalPut(ds.id,+ds.sign);break;
    case 'newdebt':openDebtForm(null);break;
    case 'savedebt':saveDebt(false);break;
    case 'debtpaid':saveDebt(true);break;
    case 'deldebt':if(!debtF.confirm){syncDebt();debtF.confirm=true;drawDebtForm();break}state.debts=state.debts.filter(d=>d.id!==debtF.id);persist();closeSheet();render(true);toast('Borrado');break;
    case 'paycard':{const c=cardInfo(accById(ds.id)),from=state.accs.find(a=>a.kind==='banco'&&a.currency!=='USD')||state.accs.find(a=>a.kind!=='credito');
      openForm('mov');Object.assign(form,{from:from?.id,to:ds.id,amount:String(c.due),note:'Pago de tarjeta'});drawForm();break}
    case 'cardedit':returnTo=null;openAccForm(ds.id);break;
    case 'frep':syncForm();form.rep=!form.rep;drawForm();break;
    case 'fsplit':syncForm();form.split=!form.split;drawForm();if(form.split)setTimeout(()=>$('#splitNames')?.focus(),50);break;
    case 'onbnext':onbNext();break;
    case 'onbdemo':onbDemo();break;
    case 'dorestore':{const b=backups()[restoreIx];if(!b)break;Object.assign(state,{txs:b.data.txs||[],cats:b.data.cats||state.cats,accs:b.data.accs||state.accs,budgets:b.data.budgets||{},recs:b.data.recs||[],goals:b.data.goals||[],debts:b.data.debts||[],accFilter:'all'});
      store.setItem(KEY,JSON.stringify(snapshot()));closeSheet();render(true);toast('Copia restaurada');break}
    case 'jarvis':openJarvis();break;
    case 'jvclose':closeJarvis();break;
    case 'jvsend':sendJarvis($('#jvInput').value);break;
    case 'mic':toggleMic();break;
    case 'voz':state.user.voz=!state.user.voz;persist();el.classList.toggle('on',state.user.voz);if(state.user.voz)speak('Listo, ahora te respondo en voz alta.');break;
    case 'fabtoggle':state.user.fab=!state.user.fab;persist();el.classList.toggle('on',state.user.fab);placeFab();break;
    case 'fabreset':state.user.fabPos=null;state.user.fab=true;persist();render(true);toast('Burbuja en su lugar');break;
    case 'export':{const blob=new Blob([JSON.stringify({app:'finanzas',v:8,...snapshot()},null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finanzas-${iso(now)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Respaldo descargado');break}
    case 'import':$('#importFile').click();break;
    case 'demo':confirmSheet('¿Cargar datos de ejemplo?','Se reemplazan tus movimientos, cuentas y categorías por los de prueba.','dodemo','Cargar ejemplo');break;
    case 'dodemo':Object.assign(state,{txs:seedData(),cats:DEFAULT_CATS.map(c=>({...c})),accs:DEFAULT_ACCS.map(a=>({...a})),budgets:{...DEFAULT_BUDGETS},...seedExtras(),accFilter:'all'});applyRecs();persist();closeSheet();render(true);toast('Datos de ejemplo cargados');break;
    case 'wipe':confirmSheet('¿Borrar todo?','Se eliminan todos tus movimientos y límites. Las cuentas y categorías vuelven a las de inicio, con saldo cero. No se puede deshacer.','dowipe','Borrar todo');break;
    case 'dowipe':Object.assign(state,{txs:[],cats:DEFAULT_CATS.map(c=>({...c})),accs:DEFAULT_ACCS.map(a=>({...a,init:0})),budgets:{},recs:[],goals:[],debts:[],accFilter:'all',chat:[]});persist();closeSheet();render(true);toast('Todo borrado');break;
  }
});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
$('#jvDim').addEventListener('click',closeJarvis);
document.addEventListener('input',e=>{
  if(e.target.id==='search'){state.q=e.target.value;$('#txList').innerHTML=txGroups(monthData())}
  if(form&&['amt','splitNames'].includes(e.target.id))liveForm();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='setName'){state.user.name=t.value.trim()||'Edward';persist();const av=$('.me-card .av');if(av)av.textContent=state.user.name[0].toUpperCase()}
  if(t.id==='setBot'){state.user.bot=t.value.trim()||'Jarvis';persist();renderStudio()}
  if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.txs))throw 0;
    Object.assign(state,{txs:s.txs,cats:s.cats||state.cats,accs:s.accs||state.accs,budgets:s.budgets||state.budgets,recs:s.recs||[],goals:s.goals||[],debts:s.debts||[]});if(s.user)Object.assign(state.user,s.user);if(THEMES[s.theme])state.theme=s.theme;
    persist();render();toast('Respaldo importado')}catch(_){toast('Ese archivo no es un respaldo válido')}};r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='jvInput')sendJarvis(e.target.value);
  else if(['amt','note'].includes(e.target.id))saveForm();
  else if(['accName','accSaldo'].includes(e.target.id))saveAcc();
  else if(['catName','catBud'].includes(e.target.id))saveCat();
  else if(['recAmt','recName','recDay'].includes(e.target.id))saveRec();
  else if(['gName','gTarget','gSaved'].includes(e.target.id))saveGoal();
  else if(e.target.id==='gAmt')$('[data-act="goalput"]')?.click();
  else if(['dAmt','dPerson','dNote'].includes(e.target.id))saveDebt(false);
  else if(e.target.id==='rate')$('[data-act="saverate"]')?.click();
  else if(e.target.id==='onbName')onbNext();
  else if(e.target.id==='setName'||e.target.id==='setBot')e.target.blur();
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(state.tab==='home')render(true);placeFab();hlSpy()},150)});

/* Hilo: el hilo de la derecha sigue tu lugar y se puede arrastrar */
$('#screen').addEventListener('scroll',()=>hlSpy(),{passive:true});
(()=>{let on=false;const pick=e=>{const t=document.elementFromPoint&&document.elementFromPoint(e.clientX,e.clientY)?.closest('.hl-t');if(t&&!t.classList.contains('on'))hlJump(t.dataset.hl,false)};
  $('#nav').addEventListener('pointerdown',e=>{if(!e.target.closest('.hl-t'))return;on=true;$('#hiloRail').classList.add('scrub')});
  addEventListener('pointermove',e=>{if(on)pick(e)});
  addEventListener('pointerup',()=>{if(!on)return;on=false;$('#hiloRail')?.classList.remove('scrub')});
})();

/* ================== INICIO ================== */
let restoreIx=0;
applyRecs();
render();
if(!state.user.onboarded)showOnb();
else{const k=mkey(now);if(state.user.lastSeen&&state.user.lastSeen<k)setTimeout(()=>openStory(),500);if(state.user.lastSeen!==k){state.user.lastSeen=k;persist()}}
showLock();
autoBackup();
setTimeout(()=>{if(state.tab==='home')showTip(insights()[0])},1400);
/* El saludo sigue la hora del celular y, si cambia el día, se anotan los gastos fijos que tocan */
(()=>{let g=greeting(),d=iso(new Date());setInterval(()=>{const n=greeting(),nd=iso(new Date());
  if(nd!==d){d=nd;applyRecs();autoBackup()}
  if(n===g)return;g=n;
  if(state.tab==='home'&&!$('#sheetWrap').classList.contains('open')&&!$('#jvWin').classList.contains('open'))render(true)},60000)})();
/* Bloqueo: al volver a la app después de un minuto se pide el PIN otra vez */
(()=>{let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(state.user.pin&&hid&&Date.now()-hid>60000)showLock()})})();
</script>
</body>
</html>
